name: Events Demo 1
on: 
  pull_request:
    types:
      - opened
  workflow_dispatch:
  push: 
    branches:
      - main
      - 'dev-*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "project/01 Starting Project"
    steps:
      - name: Output event data
        working-directory: .
        env: 
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: echo "$EVENT_JSON"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."